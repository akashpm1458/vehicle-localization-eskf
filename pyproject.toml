[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle_localization"
version = "0.1.0"
description = "Offline vehicle localization with an error-state Kalman filter fusing simulated IMU, GNSS and LiDAR-localizer positions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "threadpoolctl>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vehicle-localization = "vehicle_localization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
